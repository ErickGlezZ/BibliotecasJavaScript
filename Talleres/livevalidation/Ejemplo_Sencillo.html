<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LiveValidation - Ejemplo Sencillo</title>

  <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

  <main class="contenedor">

    <header>

      <h1>Ejemplo sencillo</h1>

      <p class="descripcion">
        Primer contacto con la validación de formularios
        utilizando LiveValidation.
      </p>

    </header>


    <form class="formulario" id="formulario">

      <!-- =============================================
           CAMPO NOMBRE
           ============================================= -->

      <div class="campo">

        <label for="nombre">
          Nombre
        </label>

        <input
          type="text"
          id="nombre"
          placeholder="Escribe tu nombre"
        >

      </div>


      <!-- =============================================
           CAMPO CORREO
           ============================================= -->

      <div class="campo">

        <label for="correo">
          Correo electrónico
        </label>

        <input
          type="text"
          id="correo"
          placeholder="ejemplo@correo.com"
        >

      </div>


      <!-- =============================================
           CAMPO CONTRASEÑA
           ============================================= -->

      <div class="campo">

        <label for="password">
          Contraseña
        </label>

        <input
          type="password"
          id="password"
          placeholder="Mínimo 8 caracteres"
        >

      </div>


      <button type="button" onclick="registrar()">Registrar</button>

    </form>


    <a class="volver" href="index_livevalidation.html">
      ← Volver al taller
    </a>

  </main>


  <!-- =================================================
       PASO 1: CARGAMOS LA BIBLIOTECA
       =================================================

       IMPORTANTE:

       Este archivo es la biblioteca LiveValidation.

       Está almacenado LOCALMENTE en nuestro proyecto.

       No necesitamos Internet para cargarlo.

       La ruta significa:

      

       ================================================= -->

  <script src="js/livevalidation_standalone.js"></script>


  <!-- =================================================
       PASO 2: NUESTRAS VALIDACIONES
       =================================================

       Este código utiliza las funciones proporcionadas
       por LiveValidation.
       ================================================= -->

  <script src="js/practica1.js"></script>

</body>

</html>
