<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LiveValidation - Ejemplo Intermedio</title>

  <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

  <main class="contenedor">

    <header>

      <h1>Ejemplo intermedio</h1>

      <p class="descripcion">
        Formulario de registro utilizando múltiples reglas
        de validación.
      </p>

    </header>


    <form class="formulario" id="formulario" novalidate>

      <!-- USUARIO -->

      <div class="campo">

        <label for="usuario">
          Nombre de usuario
        </label>

        <input
          type="text"
          id="usuario"
          placeholder="usuario123"
        >

      </div>


      <!-- TELÉFONO -->

      <div class="campo">

        <label for="telefono">
          Teléfono
        </label>

        <input type="text" id="telefono" placeholder="10 dígitos"
       inputmode="numeric" maxlength="10">

      </div>


      <!-- EDAD -->

      <div class="campo">

        <label for="edad">
          Edad
        </label>

        <input
          type="number"
          id="edad"
          placeholder="18"
        >

      </div>


      <!-- CONTRASEÑA -->

      <div class="campo">

        <label for="password">
          Contraseña
        </label>

        <input
          type="password"
          id="password"
        >

      </div>


      <!-- CONFIRMACIÓN -->

      <div class="campo">

        <label for="confirmar">
          Confirmar contraseña
        </label>

        <input
          type="password"
          id="confirmar"
        >

      </div>


      <!-- TÉRMINOS -->

      <div class="campo">

        <label>

          <input
            type="checkbox"
            id="terminos"
          >

          Acepto los términos y condiciones.

        </label>

      </div>


      <button type="submit">
        Crear cuenta
      </button>

    </form>


    <a class="volver" href="index_livevalidation.html">
      ← Volver al taller
    </a>

  </main>


  <!-- =================================================
       BIBLIOTECA LOCAL
       ================================================= -->

  <script src="js/livevalidation_standalone.js"></script>


  <!-- =================================================
       JAVASCRIPT DE ESTA PRÁCTICA
       ================================================= -->

  <script src="js/practica2.js"></script>

</body>

</html>
